name: Deploy GitHub Pages

# Pages is served from the main branch (legacy / branch deploy).
# This workflow only runs the SEO refresh. Do not call deploy-pages here:
# that needs "GitHub Actions" as the Pages source and races the branch deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-seo
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SEO build (discover pages → meta / schema / sitemap / robots)
        run: node seo-build.js

      - name: Commit SEO updates if needed
        run: |
          git config user.name "seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No SEO file changes"
          else
            git commit -m "chore(seo): auto-refresh meta, sitemap, robots [skip ci]"
            git push
          fi
